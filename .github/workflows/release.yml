name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS arm64 binary
    runs-on: macos-15
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install native dependencies
        run: brew install tesseract leptonica libarchive pkg-config

      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag must look like v0.1.0" >&2; exit 1 ;;
          esac

          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rust-ocr") | .version')"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml version $package_version" >&2
            exit 1
          fi

      - name: Build and test
        run: |
          cargo test --locked
          cargo build --locked --release
          test "$(uname -m)" = "arm64"
          file target/release/rust-ocr

      - name: Package release asset
        run: |
          archive="rust-ocr-${RELEASE_TAG}-macos-arm64.tar.gz"
          mkdir -p dist
          tar -C target/release -czf "dist/$archive" rust-ocr
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/rust-ocr-${RELEASE_TAG}-macos-arm64.tar.gz"
          checksum="$archive.sha256"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" "$checksum" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" "$checksum" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
